{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · GlobeTrotter</title>
  <link rel="stylesheet" href="{% static 'login/css/auth.css' %}">
</head>
<body>
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to plan your next trip.</p>

    <div id="error-box" class="error-box"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Log in</button>
    </form>

    <p class="switch-link">
      Don't have an account? <a href="{% url 'login:signup-page' %}">Sign up</a>
    </p>
  </div>

  <script src="{% static 'login/js/auth.js' %}"></script>
  <script>
    // If already logged in, skip straight to the dashboard.
    if (isLoggedIn()) window.location.href = "/";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError("error-box");
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        await loginUser(username, password);
        window.location.href = "/";
      } catch (err) {
        showError("error-box", err.message);
        btn.disabled = false;
        btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
