<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotter · Travel Planning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 0.875rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .brand { font-size: 1.35rem; font-weight: 700; color: #2563eb; display: flex; align-items: center; gap: 0.5rem; text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; }
    .nav-link { color: #64748b; text-decoration: none; font-size: 0.95rem; font-weight: 500; }
    .nav-link:hover, .nav-link.active { color: #2563eb; }
    .user-section { display: flex; align-items: center; gap: 1rem; }
    .user-greeting { font-size: 0.9rem; color: #475569; font-weight: 500; }
    .btn-logout { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-logout:hover { background: #dc2626; color: #ffffff; border-color: #dc2626; }
    .container { max-width: 1200px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; flex: 1; }
    .hero { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; border-radius: 16px; padding: 2.5rem 2rem; margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; }
    .hero-content h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .hero-content p { font-size: 1.05rem; opacity: 0.9; }
    .btn-create { background: #ffffff; color: #2563eb; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .section-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.25rem; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .card { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 180px; object-fit: cover; background-color: #cbd55e1; }
    .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; color: #1e293b; }
    .card-text { font-size: 0.9rem; color: #64748b; margin-bottom: 1rem; flex: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.75rem; border-top: 1px solid #f1f5f9; font-size: 0.85rem; color: #475569; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">🌍 GlobeTrotter</a>
    <div class="nav-links">
      <a href="/" class="nav-link active">Dashboard</a>
      <a href="#trips-section" class="nav-link">My Trips</a>
      <a href="#destinations-section" class="nav-link">Explore Destinations</a>
    </div>
    <div class="user-section">
      <span class="user-greeting" id="user-display">👱 Authenticated</span>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </nav>

+  <div class="container">
    <div class="hero">
      <div class="hero-content">
        <h1 id="welcome-heading">Welcome to GlobeTrotter!</h1>
        <p>Plan itineraries, explore world cities, and manage travel budgets easily.</p>
      </div>
      <button class="btn-create">+ Plan New Trip</button>
    </div>

+    <div id="trips-section">
      <div class="section-title"><span>My Recent Trips</span></div>
      <div class="grid" id="trips-grid"><div>Loading trips...</div></div>
    </div>

+    <div id="destinations-section">
      <div class="section-title"><span>Recommended Destinations</span></div>
      <div class="grid" id="destinations-grid"><div>Loading destinations...</div></div>
    </div>
  </div>

+  <script>
    const accessToken = localStorage.getItem("accessToken");
    const refreshToken = localStorage.getItem("refreshToken");

+    if (!accessToken) {
      window.location.href = "/login/";
    }

+    async function loadDashboard() {
      try {
        const response = await fetch("/api/dashboard/", {
          headers: {
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json"
          }
        });

+        if (response.status === 401) {
          handleLogout();
          return;
        }

+        const data = await response.json();
        if (data.welcome_message) {
          document.getElementById("welcome-heading").textContent = data.welcome_message;
        }
        renderTrips(data.recent_trips || []);
        renderDestinations(data.recommended_destinations || []);
      } catch (err) {
        console.error("Error loading dashboard:", err);
      }
    }

+    function renderTrips(trips) {
      const grid = document.getElementById("trips-grid");
      if (!trips.length) {
        grid.innerHTML = `<p style="color: #64748b;">No trips planned yet.</p>`;
        return;
      }
      grid.innerHTML = trips.map(trip => `
        <div class="card">
          <img src="${trip.cover_photo || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600'}" class="card-img" alt="${trip.name}">
          <div class="card-body">
            <h3 class="card-title">${trip.name}</h3>
            <p class="card-text">${trip.description || 'No description'}</p>
            <div class="card-footer">
              <span>🔥 ${trip.start_date} to ${trip.end_date}</span>
              <span>�ë $${trip.total_cost || 0}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

+    function renderDestinations(cities) {
      const grid = document.getElementById("destinations-grid");
      if (!cities.length) {
        grid.innerHTML = `<p style="color: #64748b;">No destinations found.</p>`;
        return;
      }
      grid.innerHTML = cities.map(city => `
        <div class="card">
          <img src="${city.image_url || 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=600'}" class="card-img" alt="${city.name}">
          <div class="card-body">
            <h3 class="card-title">${city.name}, ${city.country}</h3>
            <p class="card-text">${city.description || 'Explore scenic views.'}</p>
            <div class="card-footer">
              <span>❐ Popularity: ${city.popularity_score}/100</span>
              <span>💖 El: ${city.cost_index}x</span>
            </div>
          </div>
        </div>
      `).join("");
    }

+    async function handleLogout() {
      const refresh = localStorage.getItem("refreshToken");
      const access = localStorage.getItem("accessToken");
      if (refresh && access) {
        try {
          await fetch("/login/api/logout/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${access}`
            },
            body: JSON.stringify({ refresh })
          });
        } catch (err) {}
      }
      localStorage.removeItem("accessToken");
      localStorage.removeItem("refreshToken");
      window.location.href = "/login/";
    }

+    document.getElementById("logout-btn").addEventListener("click", handleLogout);
    loadDashboard();
  </script>
</body>
</html>
